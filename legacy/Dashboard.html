        /**
         * Loads a module and displays its data grid
         * Reference: Section 7.2 - Loading a Module (The View Engine)
         */
        function loadModule(moduleId) {
          // Module title mapping
          const moduleTitles = {
            HRM: "وحدة الموارد البشرية - الموظفين",
            PRJ: "وحدة المشاريع",
            FIN: "وحدة المالية",
            SYS: "إدارة النظام",
          };

          var title = moduleTitles[moduleId] || moduleId;

          // Reset module state for new module
          moduleState.currentModule = moduleId;
          const viewIdMap = {
            HRM: "VIEW_HRM_Employees",
            PRJ: "VIEW_PRJ_Main",
            FIN: "VIEW_FIN_DirectExpenses",
            SYS: "VIEW_SYS_AuditLog",
          };
          moduleState.viewId = viewIdMap[moduleId] || moduleId;
          moduleState.pagination = {
            page: 1,
            pageSize: 15,
            totalPages: 0,
            totalRecords: 0,
          };
          moduleState.searchTerm = "";
          moduleState.sortColumn = null;
          moduleState.sortDirection = "asc";

          currentEngineWindow = createWindow(
            title,
            `<div class="loading-spinner">جاري تحميل البيانات...</div>`,
            moduleId.toLowerCase()
          );

          moduleState.currentWindow = currentEngineWindow;

          try {
            const token = sessionStorage.getItem("erp_token");

            if (!token) {
              logToConsole(
                "No auth token found - redirecting to login",
                "CLIENT-ERROR"
              );
              showToast(
                "انتهت صلاحية الجلسة. الرجاء تسجيل الدخول مرة أخرى.",
                "error"
              );
              setTimeout(() => window.location.reload(), 2000);
              return;
            }

            const options = {
              page: moduleState.pagination.page,
              pageSize: moduleState.pagination.pageSize,
              searchTerm: moduleState.searchTerm,
            };

            logToConsole(
              `Loading module: ${moduleId}, viewId: ${moduleState.viewId}`,
              "CLIENT-INFO"
            );
            try {
              pushClientEvent({
                type: "module_load",
                id: moduleId,
                viewId: moduleState.viewId,
              });
            } catch (e) {}

            // Ensure backend seed completed before fetching module data
            google.script.run
              .withSuccessHandler(function () {
                var params = new URLSearchParams(location.search);
                var useDebug =
                  params.get("record") === "1" || params.get("debug") === "1";
                if (useDebug) {
                  google.script.run
                    .withSuccessHandler(function (res) {
                      try {
                        pushClientEvent({
                          type: "debug_trace",
                          trace: res && res.trace,
                        });
                      } catch (e) {}
                      var payload = res && res.res ? res.res : res;
                      logToConsole(
                        `Module data received: success=${
                          payload?.success
                        }, hasData=${!!payload?.data}`,
                        "CLIENT-INFO"
                      );
                      try {
                        pushClientEvent({
                          type: "module_data",
                          ok: !!(payload && payload.success),
                          hasData: !!(payload && payload.data),
                        });
                      } catch (e) {}
                      renderGrid(payload);
                    })
                    .withFailureHandler(function (err) {
                      const errorMsg =
                        err?.message ||
                        err?.toString?.() ||
                        "فشل الاتصال بالخادم";
                      logToConsole(
                        `Module load failed: ${errorMsg}`,
                        "CLIENT-ERROR"
                      );
                      if (currentEngineWindow) {
                        currentEngineWindow.querySelector(
                          ".window-content"
                        ).innerHTML = `
                          <div class="empty-state">
                            <svg><use href="#icon-alert-triangle"></use></svg>
                            <h4>خطأ في التحميل</h4>
                            <p>${sanitizeHtml(errorMsg)}</p>
                            <button class="toolbar-btn" onclick="loadModule('${moduleId}')" style="margin-top:20px;">
                              <svg><use href="#icon-refresh"></use></svg>
                              إعادة المحاولة
                            </button>
                          </div>
                        `;
                      }
                    })
                    .debugGetModuleData(moduleState.viewId, token, options);
                } else {
                  google.script.run
                    .withSuccessHandler(function (res) {
                      // Handle potential string response from Google Apps Script
                      var actualRes = res;
                      if (typeof res === "string") {
                        try {
                          actualRes = JSON.parse(res);
                        } catch (e) {
                          logToConsole(
                            `Failed to parse string response: ${res}`,
                            "CLIENT-ERROR"
                          );
                        }
                      }

                      logToConsole(
                        `Module data received: success=${
                          actualRes?.success
                        }, hasData=${!!actualRes?.data}, resType=${typeof actualRes}, resKeys=${Object.keys(
                          actualRes || {}
                        )}`,
                        "CLIENT-INFO"
                      );
                      try {
                        pushClientEvent({
                          type: "module_data",
                          ok: !!(actualRes && actualRes.success),
                          hasData: !!(actualRes && actualRes.data),
                        });
                      } catch (e) {}
                      // Check if response has proper structure
                      if (
                        !actualRes ||
                        typeof actualRes !== "object" ||
                        actualRes.success === undefined
                      ) {
                        logToConsole(
                          `Invalid response structure, attempting debug fallback. Response: ${JSON.stringify(
                            actualRes
                          )}`,
                          "CLIENT-ERROR"
                        );
                        try {
                          google.script.run
                            .withSuccessHandler(function (dbg) {
                              // Handle potential string response from debug call
                              var actualDbg = dbg;
                              if (typeof dbg === "string") {
                                try {
                                  actualDbg = JSON.parse(dbg);
                                } catch (e) {
                                  logToConsole(
                                    `Failed to parse debug string response: ${dbg}`,
                                    "CLIENT-ERROR"
                                  );
                                }
                              }
                              var payload =
                                actualDbg && actualDbg.res
                                  ? actualDbg.res
                                  : actualDbg;
                              renderGrid(payload);
                            })
                            .withFailureHandler(function (err) {
                              const errorMsg =
                                err?.message ||
                                err?.toString?.() ||
                                "فشل الاتصال بالخادم";
                              showToast(errorMsg, "error");
                            })
                            .debugGetModuleData(
                              moduleState.viewId,
                              token,
                              options
                            );
                        } catch (e) {
                          showToast("خطأ غير متوقع", "error");
                        }
                      } else {
                        renderGrid(actualRes);
                      }
                    })
                    .withFailureHandler(function (err) {
                      const errorMsg =
                        err?.message ||
                        err?.toString?.() ||
                        "فشل الاتصال بالخادم";
                      logToConsole(
                        `Module load failed: ${errorMsg}`,
                        "CLIENT-ERROR"
                      );
                      if (currentEngineWindow) {
                        currentEngineWindow.querySelector(
                          ".window-content"
                        ).innerHTML = `
                          <div class="empty-state">
                            <svg><use href="#icon-alert-triangle"></use></svg>
                            <h4>خطأ في التحميل</h4>
                            <p>${sanitizeHtml(errorMsg)}</p>
                            <button class="toolbar-btn" onclick="loadModule('${moduleId}')" style="margin-top:20px;">
                              <svg><use href="#icon-refresh"></use></svg>
                              إعادة المحاولة
                            </button>
                          </div>
                        `;
                      }
                    })
                    .getModuleData(moduleState.viewId, token, options);
                }
              })
              .withFailureHandler(function () {
                // Even if seeding fails silently, attempt to fetch the module data
                google.script.run
                  .withSuccessHandler(renderGrid)
                  .withFailureHandler(function (e) {
                    showToast("فشل الاتصال بالخادم", "error");
                  })
                  .getModuleData(moduleState.viewId, token, options);
              })
              .seedSystemData();
          } catch (e) {
            logToConsole(
              "Error loading module: " + (e?.message || e),
              "CLIENT-ERROR"
            );
            if (currentEngineWindow) {
              currentEngineWindow.querySelector(".window-content").innerHTML = `
                  <div class="empty-state">
                    <svg><use href="#icon-alert-triangle"></use></svg>
                    <h4>خطأ غير متوقع</h4>
                    <p>${sanitizeHtml(e?.message || String(e))}</p>
                  </div>
                `;
            }
          }
        }

        /**
         * Renders the enhanced data grid with actions, pagination, and sorting
         * Reference: Section 7.2 - Loading a Module (The View Engine)
         */
        function renderGrid(res) {
          // Normalize payload: unwrap debug wrapper and legacy shapes
          try {
            res = res && res.res ? res.res : res;
            if (res && Array.isArray(res.rows) && !res.data) {
              res.data = res.rows;
            }
            // Ensure data is always an array
            if (res && !Array.isArray(res.data)) {
              res.data = [];
            }
            // Ensure headers is always an array
            if (res && !Array.isArray(res.headers)) {
              res.headers = [];
            }
          } catch (e) {
            logToConsole(
              `Data normalization error: ${e.message}`,
              "CLIENT-ERROR"
            );
            res = {
              success: false,
              data: [],
              headers: [],
              message: "Data normalization failed",
            };
          }
          // Comprehensive null/undefined check
          if (res === null || res === undefined) {
            logToConsole(
              "renderGrid received null/undefined response",
              "CLIENT-ERROR"
            );
            try {
              // Attempt one-time fallback to debug endpoint to fetch payload shape
              if (!moduleState._debugFallbackTried) {
                moduleState._debugFallbackTried = true;
                const token = sessionStorage.getItem("erp_token");
                const options = {
                  page: moduleState.pagination.page,
                  pageSize: moduleState.pagination.pageSize,
                  searchTerm: moduleState.searchTerm,
                  sortColumn: moduleState.sortColumn,
                  sortDirection: moduleState.sortDirection,
                };
                google.script.run
                  .withSuccessHandler(function (dbg) {
                    var payload = dbg && dbg.res ? dbg.res : dbg;
                    renderGrid(payload);
                  })
                  .withFailureHandler(function () {
                    // Fall back to UI error state below
                  })
                  .debugGetModuleData(moduleState.viewId, token, options);
                return;
              }
            } catch (e) {}
            if (currentEngineWindow) {
              currentEngineWindow.querySelector(".window-content").innerHTML = `
                <div class="empty-state">
                  <svg><use href="#icon-alert-triangle"></use></svg>
                  <h4>خطأ في التحميل</h4>
                  <p>لم يتم استلام أي بيانات من الخادم</p>
                  <button class="toolbar-btn" onclick="refreshGrid()" style="margin-top:20px;">
                    <svg><use href="#icon-refresh"></use></svg>
                    إعادة المحاولة
                  </button>
                </div>
              `;
            }
            return;
          }

          // Check for success flag
          if (!res.success) {
            // Extract error message with multiple fallbacks
            let msg = "خطأ غير معروف";
            if (res.message && typeof res.message === "string") {
              msg = res.message;
            } else if (res.error && typeof res.error === "string") {
              msg = res.error;
            } else if (typeof res === "string") {
              msg = res;
            }

            logToConsole(
              `renderGrid error: ${msg}, code: ${res.code || "none"}`,
              "CLIENT-ERROR"
            );

            // Handle auth errors
            if (res.code === "AUTH_REQUIRED") {
              showToast(
                "انتهت صلاحية الجلسة. الرجاء تسجيل الدخول مرة أخرى.",
                "error"
              );
              setTimeout(() => window.location.reload(), 2000);
              return;
            }

            // Display error with retry button
            if (currentEngineWindow) {
              currentEngineWindow.querySelector(".window-content").innerHTML = `
                <div class="empty-state">
                  <svg><use href="#icon-alert-triangle"></use></svg>
                  <h4>خطأ في التحميل</h4>
                  <p>${sanitizeHtml(msg)}</p>
                  <button class="toolbar-btn" onclick="refreshGrid()" style="margin-top:20px;">
                    <svg><use href="#icon-refresh"></use></svg>
                    إعادة المحاولة
                  </button>
                </div>
              `;
            }
            return;
          }

          logToConsole(
            `renderGrid success: ${res.data?.length || 0} records`,
            "CLIENT-INFO"
          );

          // Update module state
          moduleState.sourceSheet = res.sourceSheet;
          moduleState.viewId = res.viewId;
          if (res.pagination) {
            moduleState.pagination = res.pagination;
          }

          const headers = Array.isArray(res.headers) ? res.headers : [];
          const rows = Array.isArray(res.data) ? res.data : [];
          const buttons = Array.isArray(res.buttons) ? res.buttons : [];

          // Build Toolbar HTML
          let toolbarHtml = `
            <div class="module-toolbar">
              <div class="toolbar-search">
                <input type="text" id="grid-search" placeholder="بحث..." value="${sanitizeHtml(
                  moduleState.searchTerm
                )}" spellcheck="false">
                <button class="toolbar-btn" onclick="refreshGrid()" title="تحديث">
                  <svg><use href="#icon-refresh"></use></svg>
                </button>
              </div>
              <div class="toolbar-actions">
                <button class="toolbar-btn" onclick="openAddForm()">
                  <svg><use href="#icon-plus"></use></svg>
                  <span>إضافة موظف</span>
                </button>
                <button class="toolbar-btn" onclick="openHeadersVerification()" title="تحقق الرؤوس">
                  <svg><use href="#icon-info"></use></svg>
                  <span>تحقق الرؤوس</span>
                </button>
                <button class="toolbar-btn" onclick="openEngineValidation()" title="تحقق المحرك">
                  <svg><use href="#icon-info"></use></svg>
                  <span>تحقق المحرك</span>
                </button>
              </div>
            </div>
          `;

          // Build Table Headers with sort indicators
          let th = headers
            .map((h, idx) => {
              let sortClass = "";
              if (moduleState.sortColumn === idx) {
                sortClass =
                  moduleState.sortDirection === "asc"
                    ? "sorted-asc"
                    : "sorted-desc";
              }
              return `<th class="${sortClass}" onclick="sortByColumn(${idx})">${sanitizeHtml(
                h
              )}</th>`;
            })
            .join("");
          th += `<th style="width:120px;">إجراءات</th>`;

          // Build Table Rows with action buttons
          let tb = "";
          if (rows.length === 0) {
            tb = `<tr><td colspan="${
              headers.length + 1
            }" style="text-align:center; padding:40px;">
              <div class="empty-state" style="padding:20px;">
                <svg style="width:50px;height:50px;"><use href="#icon-inbox"></use></svg>
                <h4>لا توجد بيانات</h4>
                <p>لم يتم العثور على سجلات${
                  moduleState.searchTerm ? " تطابق البحث" : ""
                }</p>
              </div>
            </td></tr>`;
          } else {
            tb = rows
              .map((row) => {
                const cells = Array.isArray(row.cells)
                  ? row.cells
                  : Array.isArray(row)
                  ? row
                  : [];
                const recordId = row._id || (cells.length > 0 ? cells[0] : "");

                let tds = cells
                  .map((c) => `<td>${sanitizeHtml(c)}</td>`)
                  .join("");

                // Action buttons column
                tds += `<td class="actions-cell">
                <button class="row-action-btn view-btn" onclick="viewRecord('${sanitizeHtml(
                  recordId
                )}')" title="عرض">
                  <svg><use href="#icon-eye"></use></svg>
                </button>
                <button class="row-action-btn edit-btn" onclick="editRecord('${sanitizeHtml(
                  recordId
                )}')" title="تعديل">
                  <svg><use href="#icon-edit"></use></svg>
                </button>
                <button class="row-action-btn delete-btn" onclick="confirmDelete('${sanitizeHtml(
                  recordId
                )}')" title="حذف">
                  <svg><use href="#icon-trash"></use></svg>
                </button>
              </td>`;

                return `<tr data-id="${sanitizeHtml(recordId)}">${tds}</tr>`;
              })
              .join("");
          }

          // Build Pagination HTML
          const pg = moduleState.pagination;
          let paginationHtml = `
            <div class="pagination">
              <button class="pagination-btn" onclick="goToPage(1)" ${
                pg.page <= 1 ? "disabled" : ""
              }>
                <svg style="transform:rotate(180deg);width:14px;height:14px;"><use href="#icon-chevron-right"></use></svg>
                <svg style="transform:rotate(180deg);width:14px;height:14px;"><use href="#icon-chevron-right"></use></svg>
              </button>
              <button class="pagination-btn" onclick="goToPage(${
                pg.page - 1
              })" ${pg.page <= 1 ? "disabled" : ""}>
                <svg style="width:14px;height:14px;"><use href="#icon-chevron-right"></use></svg>
              </button>
              <span class="pagination-info">
                صفحة <strong>${pg.page}</strong> من <strong>${
            pg.totalPages || 1
          }</strong>
                &nbsp;|&nbsp;
                <strong>${pg.totalRecords}</strong> سجل
              </span>
              <button class="pagination-btn" onclick="goToPage(${
                pg.page + 1
              })" ${pg.page >= pg.totalPages ? "disabled" : ""}>
                <svg style="width:14px;height:14px;"><use href="#icon-chevron-left"></use></svg>
              </button>
              <button class="pagination-btn" onclick="goToPage(${
                pg.totalPages
              })" ${pg.page >= pg.totalPages ? "disabled" : ""}>
                <svg style="width:14px;height:14px;"><use href="#icon-chevron-left"></use></svg>
                <svg style="width:14px;height:14px;"><use href="#icon-chevron-left"></use></svg>
              </button>
            </div>
          `;

          // Combine all HTML
          const html = `
            ${toolbarHtml}
            <div class="data-table-container">
              <table class="data-table">
                <thead><tr>${th}</tr></thead>
                <tbody>${tb}</tbody>
              </table>
            </div>
            ${rows.length > 0 ? paginationHtml : ""}
          `;

          if (currentEngineWindow) {
            currentEngineWindow.querySelector(".window-content").innerHTML =
              html;

            // Attach search handler
            const searchInput =
              currentEngineWindow.querySelector("#grid-search");
            if (searchInput) {
              let searchTimeout;
              searchInput.addEventListener("input", (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                  moduleState.searchTerm = e.target.value;
                  moduleState.pagination.page = 1;
                  refreshGrid();
                }, 400);
              });
            }
          }
        }
        function sanitizeHtml(input) {
          var div = document.createElement("div");
          div.innerText =
            input === undefined || input === null ? "" : String(input);
          return div.innerHTML;
        }

        // ================================================================================

        /**
         * Renders the Add/Edit form modal
         * Reference: Section 7.3 - Data Entry (The Form Engine)
         */
        function renderFormModal(res, mode, recordId) {
          const formTitle =
            mode === "edit" ? "تعديل بيانات الموظف" : "إضافة موظف جديد";
          const tabs = res.tabs || [
            { id: "main", label: "الرئيسية", fields: res.fields || [] },
          ];
          const arMap = {
            "Basic Info": "المعلومات الأساسية",
            Contact: "بيانات الاتصال",
            "Job Info": "معلومات الوظيفة",
            Financial: "البيانات المالية",
          };
          tabs.forEach((t) => {
            if (t && arMap[t.label]) t.label = arMap[t.label];
          });

          // Build tabs navigation
          let tabsNavHtml =
            tabs.length > 1
              ? `
            <div class="modal-tabs">
              ${tabs
                .map(
                  (tab, idx) => `
                <button type="button" class="modal-tab ${
                  idx === 0 ? "active" : ""
                }" data-tab="${tab.id}">
                  ${sanitizeHtml(tab.label)}
                </button>
              `
                )
                .join("")}
            </div>
          `
              : "";

          // Build form fields grouped by tabs
          let tabsContentHtml = tabs
            .map((tab, idx) => {
              let fieldsHtml = (tab.fields || [])
                .map((field) => {
                  const isRequired = field.mandatory;
                  const isReadOnly = field.readOnly || mode === "view";
                  const fieldValue =
                    field.value !== undefined ? field.value : "";

                  let inputHtml = "";
                  const fieldType = String(field.type || "TEXT").toUpperCase();

                  if (fieldType === "DROPDOWN" || fieldType === "LOOKUP") {
                    const options = (field.options || [])
                      .map(
                        (opt) =>
                          `<option value="${sanitizeHtml(opt.value)}" ${
                            opt.value === fieldValue ? "selected" : ""
                          }>${sanitizeHtml(opt.label)}</option>`
                      )
                      .join("");
                    inputHtml = `
                  <select id="field-${field.id}" name="${field.id}" ${
                      isReadOnly ? "disabled" : ""
                    } ${isRequired ? "required" : ""}>
                    <option value="">اختر...</option>
                    ${options}
                  </select>
                `;
                  } else if (fieldType === "TEXTAREA") {
                    inputHtml = `
                  <textarea id="field-${field.id}" name="${field.id}" rows="3" 
                    ${isReadOnly ? "readonly" : ""} ${
                      isRequired ? "required" : ""
                    }
                    placeholder="${sanitizeHtml(
                      field.placeholder || ""
                    )}">${sanitizeHtml(fieldValue)}</textarea>
                `;
                  } else if (fieldType === "DATE") {
                    const dateVal = fieldValue
                      ? new Date(fieldValue).toISOString().split("T")[0]
                      : "";
                    inputHtml = `
                  <input type="date" id="field-${field.id}" name="${
                      field.id
                    }" value="${dateVal}"
                    ${isReadOnly ? "readonly" : ""} ${
                      isRequired ? "required" : ""
                    }>
                `;
                  } else if (fieldType === "NUMBER") {
                    inputHtml = `
                  <input type="number" id="field-${field.id}" name="${
                      field.id
                    }" value="${sanitizeHtml(fieldValue)}"
                    ${isReadOnly ? "readonly" : ""} ${
                      isRequired ? "required" : ""
                    }
                    placeholder="${sanitizeHtml(field.placeholder || "")}">
                `;
                  } else if (fieldType === "EMAIL") {
                    inputHtml = `
                  <input type="email" id="field-${field.id}" name="${
                      field.id
                    }" value="${sanitizeHtml(fieldValue)}"
                    ${isReadOnly ? "readonly" : ""} ${
                      isRequired ? "required" : ""
                    }
                    placeholder="${sanitizeHtml(field.placeholder || "")}">
                `;
                  } else if (fieldType === "BOOLEAN") {
                    inputHtml = `
                  <select id="field-${field.id}" name="${field.id}" ${
                      isReadOnly ? "disabled" : ""
                    }>
                    <option value="true" ${
                      fieldValue === true || fieldValue === "true"
                        ? "selected"
                        : ""
                    }>نعم</option>
                    <option value="false" ${
                      fieldValue === false || fieldValue === "false"
                        ? "selected"
                        : ""
                    }>لا</option>
                  </select>
                `;
                  } else {
                    inputHtml = `
                  <input type="text" id="field-${field.id}" name="${
                      field.id
                    }" value="${sanitizeHtml(fieldValue)}"
                    ${isReadOnly ? "readonly" : ""} ${
                      isRequired ? "required" : ""
                    }
                    placeholder="${sanitizeHtml(
                      field.placeholder || ""
                    )}" spellcheck="false">
                `;
                  }

                  return `
                <div class="form-field">
                  <label for="field-${field.id}">
                    ${sanitizeHtml(field.label)}
                    ${isRequired ? '<span class="required">*</span>' : ""}
                  </label>
                  ${inputHtml}
                  <div class="field-error" id="error-${field.id}"></div>
                </div>
              `;
                })
                .join("");

              return `
              <div class="tab-content ${idx === 0 ? "active" : ""}" data-tab="${
                tab.id
              }">
                <div class="form-grid-enhanced">
                  ${fieldsHtml}
                </div>
              </div>
            `;
            })
            .join("");

          const overlay = document.createElement("div");
          overlay.className = "modal-overlay";
          overlay.id = "form-modal";
          overlay.innerHTML = `
            <div class="modal" style="max-width:900px;">
              <div class="modal-header">
                <div class="modal-title">
                  <svg><use href="#icon-${
                    mode === "edit" ? "edit" : "plus"
                  }"></use></svg>
                  <span>${sanitizeHtml(formTitle)}</span>
                </div>
                <button class="modal-close" onclick="closeModal()">
                  <svg><use href="#icon-x"></use></svg>
                </button>
              </div>
              <div class="modal-body">
                <form id="entity-form">
                  ${tabsNavHtml}
                  ${tabsContentHtml}
                </form>
              </div>
              <div class="modal-footer">
                <button class="modal-btn modal-btn-secondary" onclick="closeModal()">إلغاء</button>
                <button class="modal-btn modal-btn-primary" id="form-submit-btn" onclick="submitForm('${mode}', '${sanitizeHtml(
            recordId || ""
          )}', '${res.formId || "FORM_HRM_EMP"}')">
                  <svg><use href="#icon-save"></use></svg>
                  ${mode === "edit" ? "حفظ التعديلات" : "حفظ"}
                </button>
              </div>
            </div>
          `;
          document.body.appendChild(overlay);

          // Setup tab switching
          overlay.querySelectorAll(".modal-tab").forEach((tabBtn) => {
            tabBtn.addEventListener("click", (e) => {
              e.preventDefault();
              overlay
                .querySelectorAll(".modal-tab")
                .forEach((t) => t.classList.remove("active"));
              overlay
                .querySelectorAll(".tab-content")
                .forEach((c) => c.classList.remove("active"));
              tabBtn.classList.add("active");
              overlay
                .querySelector(`.tab-content[data-tab="${tabBtn.dataset.tab}"]`)
                ?.classList.add("active");
            });
          });
        }

        /**
         * Submits the form data
         */
        window.submitForm = function (mode, recordId, formId) {
          const form = document.getElementById("entity-form");
          const submitBtn = document.getElementById("form-submit-btn");

          if (!form) return;

          // Collect form data
          const payload = {};
          let hasErrors = false;

          form.querySelectorAll("input, select, textarea").forEach((input) => {
            const fieldId = input.name;
            if (!fieldId) return;

            payload[fieldId] = input.value;

            // Clear previous error
            const errorEl = document.getElementById(`error-${fieldId}`);
            if (errorEl) errorEl.textContent = "";
            input.classList.remove("error");

            // Validate required fields
            if (input.required && !input.value.trim()) {
              hasErrors = true;
              input.classList.add("error");
              if (errorEl) errorEl.textContent = "هذا الحقل مطلوب";
            }
          });

          if (hasErrors) {
            showToast("الرجاء تعبئة جميع الحقول المطلوبة", "warning");
            return;
          }

          // Add record ID for edit mode
          if (mode === "edit" && recordId) {
            payload._id = recordId;
          }

          // Disable submit button
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.innerHTML = "<span>جاري الحفظ...</span>";
          }

          const token = sessionStorage.getItem("erp_token");
          const saveFunction =
            mode === "edit" ? "updateEngineRecord" : "saveEngineRecord";

          try {
            google.script.run
              .withSuccessHandler((res) => {
                if (res && res.success) {
                  closeModal();
                  showToast(res.message || "تم الحفظ بنجاح", "success");
                  refreshGrid();
                } else {
                  if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<svg><use href="#icon-save"></use></svg>${
                      mode === "edit" ? "حفظ التعديلات" : "حفظ"
                    }`;
                  }

                  // Show field-specific error if available
                  if (res?.field) {
                    const errorEl = document.getElementById(
                      `error-${res.field}`
                    );
                    const inputEl = document.querySelector(
                      `[name="${res.field}"]`
                    );
                    if (errorEl) errorEl.textContent = res.message;
                    if (inputEl) inputEl.classList.add("error");
                  } else {
                    showToast(res?.message || "فشل الحفظ", "error");
                  }
                }
              })
              .withFailureHandler((e) => {
                if (submitBtn) {
                  submitBtn.disabled = false;
                  submitBtn.innerHTML = `<svg><use href="#icon-save"></use></svg>${
                    mode === "edit" ? "حفظ التعديلات" : "حفظ"
                  }`;
                }
                showToast("خطأ في الاتصال: " + (e?.message || e), "error");
              })
              [saveFunction](formId, payload, token);
          } catch (e) {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.innerHTML = `<svg><use href="#icon-save"></use></svg>${
                mode === "edit" ? "حفظ التعديلات" : "حفظ"
              }`;
            }
            showToast("خطأ غير متوقع", "error");
          }
        };

        // ================================================================================

        /**
         * Shows a toast notification
         */
        function showToast(message, type = "info") {
          const iconMap = {
            success: "icon-check",
            error: "icon-x",
            warning: "icon-alert-triangle",
            info: "icon-eye",
          };

          const toast = document.createElement("div");
          toast.className = `toast ${type}`;
          toast.innerHTML = `
            <svg><use href="#${iconMap[type] || iconMap.info}"></use></svg>
            <span class="toast-message">${sanitizeHtml(message)}</span>
            <button class="toast-close" onclick="this.parentElement.remove()">×</button>
          `;

          toastContainer.appendChild(toast);

          // Auto-remove after 5 seconds
          setTimeout(() => {
            toast.style.animation = "slideInRight 0.3s ease reverse";
            setTimeout(() => toast.remove(), 300);
          }, 5000);
        }

        // Legacy renderForm function for backward compatibility
        function renderForm(res) {
          var overlay = document.createElement("div");
          overlay.className = "modal-overlay";
          var modal = document.createElement("div");
          modal.className = "modal";
          var title = document.createElement("h3");
          title.textContent = res && res.title ? res.title : "";
          var form = document.createElement("div");
          form.className = "form-grid";
          (res && res.fields ? res.fields : []).forEach(function (f) {
            var wrap = document.createElement("div");
            wrap.className = "form-field";
            var label = document.createElement("label");
            label.textContent = f.label || f.id;
            var input;
            var t = String(f.type || "").toUpperCase();
            if (t === "DROPDOWN") {
              input = document.createElement("select");
              (f.options || []).forEach(function (opt) {
                var o = document.createElement("option");
                o.value = opt.value;
                o.textContent = opt.label || opt.value;
                input.appendChild(o);
              });
            } else {
              input = document.createElement("input");
              input.type = t === "NUMBER" ? "number" : "text";
            }
            try {
              input.setAttribute("spellcheck", "false");
            } catch (e) {}
            input.id = f.id;
            if (f.mandatory) input.required = true;
            wrap.appendChild(label);
            wrap.appendChild(input);
            form.appendChild(wrap);
          });
          var actions = document.createElement("div");
          actions.className = "modal-actions";
          var saveBtn = document.createElement("button");
          saveBtn.textContent = "حفظ";
          saveBtn.className = "btn-save";
          saveBtn.addEventListener("click", function () {
            var payload = {};
            (res.fields || []).forEach(function (f) {
              var el = document.getElementById(f.id);
              payload[f.id] = el ? el.value : "";
            });
            try {
              const token = sessionStorage.getItem("erp_token");
              google.script.run
                .withSuccessHandler(function (res) {
                  overlay.remove();
                  loadModule("HRM");
                })
                .saveEngineRecord(res.formId || "FORM_HRM_EMP", payload, token);
            } catch (e) {}
          });
          var closeBtn = document.createElement("button");
          closeBtn.textContent = "إغلاق";
          closeBtn.className = "btn-close-modal";
          closeBtn.addEventListener("click", function () {
            overlay.remove();
          });
          actions.appendChild(saveBtn);
          actions.appendChild(closeBtn);
          modal.appendChild(title);
          modal.appendChild(form);
          modal.appendChild(actions);
          overlay.appendChild(modal);
          document.body.appendChild(overlay);
        }

                {
                  action: "add-expense",
                  icon: "#icon-plus",
                  title: "إضافة مصروف",
                },
                {
                  action: "add-income",
                  icon: "#icon-plus",
                  title: "إضافة إيراد",
                },
              ],
            }
          );
        });
        document.getElementById("app-sys").addEventListener("click", () => {
          openOrFocusWindow(
            "sys",
            "سجل تدقيق النظام (SYS)",
            `<pre class="audit-log">...</pre>`
          );
        });

        document
          .getElementById("app-grid")
          .addEventListener("click", arrangeWindowsInGrid);
        document
          .getElementById("app-cascade")
          .addEventListener("click", arrangeWindowsCascade);
        document
          .getElementById("app-minimize-all")
          .addEventListener("click", minimizeAllWindows);
        document
          .getElementById("app-expand-all")
          .addEventListener("click", expandAllWindows);

        // --- REAL BACKEND LOGOUT ---
        document
          .getElementById("app-shutdown")
          .addEventListener("click", () => {
            try {
              const token = sessionStorage.getItem("erp_token");
              if (token) google.script.run.logout(token);
            } catch (e) {}
            sessionStorage.removeItem("erp_token");
            sessionStorage.clear();
            window.location.reload();
          });

        // --- 7. Floating Action Button (FAB) Manager ---
        const fabStore = {};
        function ensureFabExists(moduleId, mainIconHref, subModules) {
          if (fabStore[moduleId]) return;

          logToConsole(`Creating FAB for module: ${moduleId}`, "CLIENT-INFO");

          const fab = fabTemplate.content
            .cloneNode(true)
            .querySelector(".module-fab");
          fab.id = `fab-${moduleId}`;

          fab.querySelector(
            ".fab-main"
          ).innerHTML = `<svg><use href="${mainIconHref}"></use></svg>`;

          const raysContainer = fab.querySelector(".fab-rays");
          subModules.forEach((mod, index) => {
            const ray = fabRayTemplate.content
              .cloneNode(true)
              .querySelector(".fab-ray");
            const subApp = ray.querySelector(".fab-sub-app");
            subApp.dataset.action = mod.action;
            subApp.title = mod.title;
            subApp.innerHTML = `<svg><use href="${mod.icon}"></use></svg>`;
            const angle = -45 + index * 45;
            ray.style.transform = `translate(30px, 30px) rotate(${angle}deg)`;
            raysContainer.appendChild(ray);
          });

          makeDraggable(fab.querySelector(".fab-main"), fab, true);

          raysContainer.addEventListener("click", (e) => {
            const actionBtn = e.target.closest(".fab-sub-app");
            if (actionBtn) {
              const action = actionBtn.dataset.action;
              logToConsole(`FAB Action: ${action}`, "CLIENT-EVENT");

              // Handle different FAB actions
              switch (action) {
                case "add-employee":
                  openAddForm();
                  break;
                case "search-employee":
                  // Focus the search input in the current grid
                  const searchInput = document.querySelector("#grid-search");
                  if (searchInput) {
                    searchInput.focus();
                    searchInput.select();
                  }
                  break;
                case "add-project":
                  logToConsole(
                    "Add project - not yet implemented",
                    "CLIENT-INFO"
                  );
                  break;
                default:
                  logToConsole(`Unknown action: ${action}`, "CLIENT-WARN");
              }

              fab.classList.remove("active");
              e.stopPropagation();
            }
          });

          fabContainer.appendChild(fab);
          fabStore[moduleId] = fab;

          // Show the FAB immediately when created
          fab.style.display = "block";
        }

        /**
         * Toggles FAB visibility (called from eye icon in window header)
         * This shows/hides the entire FAB button
         */
        function toggleFabForModule(moduleId) {
          const fab = fabStore[moduleId];
          if (fab) {
            const isCurrentlyVisible = fab.style.display !== "none";

            if (isCurrentlyVisible) {
              // Hide FAB and close rays
              fab.style.display = "none";
              fab.classList.remove("active");
              logToConsole(`FAB hidden for ${moduleId}`, "CLIENT-EVENT");
            } else {
              // Show FAB (rays remain closed until user clicks FAB)
              fab.style.display = "block";
              logToConsole(`FAB shown for ${moduleId}`, "CLIENT-EVENT");
            }
          }
        }

        // --- 8. Task Switcher Manager ---
        function addTaskThumb(windowId, moduleId, title) {
          const thumb = taskThumbTemplate.content
            .cloneNode(true)
            .querySelector(".task-thumb");
          thumb.dataset.windowId = windowId;

          const iconHref = moduleIcons[moduleId] || "#icon-sys";
          thumb.querySelector("svg use").setAttribute("href", iconHref);

          thumb.querySelector(".task-thumb-title").textContent =
            title.substring(0, 10) + "...";

          thumb.addEventListener("click", () => {
            const windowEl = document.getElementById(windowId);
            if (windowEl) {
              bringWindowToFront(windowEl);
            }
          });

          taskSwitcher.appendChild(thumb);
        }

        function removeTaskThumb(windowId) {
          document
            .querySelector(`.task-thumb[data-window-id="${windowId}"]`)
            ?.remove();
        }

        // --- 9. Global Log Function ---
        function logToConsole(message, type = "CLIENT-INFO") {
          console.log(`[${type}] ${message}`);
        }

        /**
         * Opens a form modal (legacy function - now uses new modal system)
         */
        function openForm(formId) {
          logToConsole(`Opening Form: ${formId}`, "CLIENT-INFO");

          // Use the new form modal system
          if (formId === "FORM_HRM_EMP") {
            openAddForm();
            return;
          }

          // Fallback for other forms
          try {
            google.script.run
              .withSuccessHandler((res) => {
                if (res && res.success) {
                  renderFormModal(res, "add");
                } else {
                  showToast(res?.message || "فشل تحميل النموذج", "error");
                }
              })
              .withFailureHandler((e) => {
                showToast("خطأ في الاتصال: " + (e?.message || e), "error");
                logToConsole(
                  "Form Load Failed: " + (e?.message || e),
                  "CLIENT-ERROR"
                );
              })
              .getFormDefinition(formId, "add", null);
          } catch (e) {
            console.error(e);
          }
        }

        try {
          google.script.run.seedSystemData();
          logToConsole("Seed job triggered", "CLIENT-INFO");
        } catch (e) {}
      });
    </script>
  </body>
</html>
