<!DOCTYPE html>
<html lang="ar" dir="rtl" spellcheck="false">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nijjara-OS | جاري التمهيد...</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- II. CSS STYLES --- */

      :root {
        --font-family: "Cairo", sans-serif;
        --font-mono: "Share Tech Mono", monospace;
        --color-bg-dark-matter: #07080d;
        --color-bg-glass: rgba(25, 28, 48, 0.6);
        --color-border-glass: rgba(255, 255, 255, 0.15);
        --color-text: #e0e0e0;
        --color-text-muted: #aaa;
        --color-accent-primary: #0078f0;
        --color-accent-secondary: #00a0f0;
        --color-accent-red: #d93030;
        --color-accent-green: #30d970;
        --shadow-depth-md: 0 5px 15px rgba(0, 0, 0, 0.3);
        --shadow-depth-lg: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      /* --- Global Reset & Body --- */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        overflow: hidden;
        height: 100vh;
        width: 100vw;
        background-color: var(--color-bg-dark-matter);
        color: var(--color-text);
        font-family: var(--font-family);
        direction: rtl;
      }

      /* --- 1. BOOT SCREEN (Login) --- */
      #boot-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        background: #000;
        z-index: 1000;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        transition: opacity 1s ease-out, visibility 1s ease-out;
      }
      #boot-log {
        width: 450px;
        font-family: var(--font-mono);
        font-size: 1rem;
        color: var(--color-accent-green);
      }
      #boot-log p {
        margin-bottom: 5px;
        white-space: pre;
      }
      .login-box {
        display: none;
        flex-direction: column;
        width: 350px;
        margin-top: 20px;
        padding: 25px;
        border: 1px solid var(--color-accent-primary);
        box-shadow: var(--shadow-depth-lg);
        background: var(--color-bg-glass);
        border-radius: 12px;
      }
      .login-box h2 {
        font-family: var(--font-family);
        text-align: center;
        color: var(--color-accent-primary);
        margin-bottom: 20px;
      }
      .login-box input {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--color-text-muted);
        color: var(--color-text);
        padding: 12px;
        margin-bottom: 15px;
        font-family: var(--font-family);
        font-size: 1rem;
        text-align: right;
        border-radius: 5px;
      }
      .login-box input:focus {
        outline: none;
        border-color: var(--color-accent-primary);
        box-shadow: 0 0 8px var(--color-accent-secondary);
      }
      .login-box button {
        background: var(--color-accent-primary);
        border: none;
        color: #fff;
        padding: 12px;
        font-family: var(--font-family);
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.3s;
        border-radius: 5px;
      }
      .login-box button:hover {
        background: var(--color-accent-secondary);
        box-shadow: var(--shadow-depth-md);
        transform: translateY(-2px);
      }
      .login-box button:disabled {
        background: var(--color-text-muted);
        cursor: not-allowed;
      }
      #login-feedback {
        color: var(--color-accent-red);
        text-align: center;
        margin-top: 15px;
        height: 20px;
        font-size: 0.9rem;
      }

      /* --- 2. NIJJARA-OS INTERFACE (The "Desktop") --- */
      #nijjara-os {
        display: none;
        height: 100vh;
        width: 100vw;
        position: relative;
      }

      /* --- 2.1 The "Holo-Deck" (Desktop Background) --- */
      #holo-deck {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(
          ellipse at 50% 50%,
          #1a1a2e 0%,
          var(--color-bg-dark-matter) 70%
        );
        z-index: 1;
      }
      #particles {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: radial-gradient(
          rgba(255, 255, 255, 0.1) 1px,
          transparent 1px
        );
        background-size: 5px 5px;
        animation: pulse 15s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.2;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.4;
        }
        100% {
          transform: scale(1);
          opacity: 0.2;
        }
      }

      /* --- 2.2 The "Neural Dock" (Taskbar) --- */
      #neural-dock {
        position: fixed;
        bottom: -85px;
        left: 50%;
        transform: translateX(-50%);
        height: 90px;
        padding: 10px 15px;
        padding-bottom: 30px;
        display: flex;
        gap: 0;
        align-items: center;
        justify-content: center;
        z-index: 999;
        background: var(--color-bg-glass);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--color-border-glass);
        border-radius: 15px;
        box-shadow: var(--shadow-depth-lg);
        animation: slideInUp 1s ease-out;
        transition: bottom 0.2s ease-out;
      }

      #neural-dock:hover {
        bottom: 0px;
      }

      .dock-group {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        height: 100%;
      }
      .dock-group.modules {
        border-left: 1px solid var(--color-border-glass);
        padding-left: 20px;
        margin-left: 10px;
      }
      .dock-group.window-mgmt {
        border-right: 1px solid var(--color-border-glass);
        padding-right: 20px;
        margin-right: 10px;
      }

      .dock-app {
        width: 70px;
        height: 70px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: var(--color-text-muted);
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        padding: 5px;
      }
      .dock-app-icon {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dock-app-icon svg {
        width: 100%;
        height: 100%;
        stroke: var(--color-text-muted);
        transition: all 0.3s ease;
      }
      .dock-app-label {
        font-family: var(--font-family);
        font-size: 0.75rem;
        font-weight: 400;
        margin-top: 5px;
        color: var(--color-text-muted);
        transition: all 0.3s ease;
      }
      .dock-app:hover {
        transform: scale(1.1) translateY(-10px);
        background: var(--color-accent-primary);
        color: #fff;
      }
      .dock-app:hover .dock-app-icon svg {
        stroke: #fff;
      }
      .dock-app:hover .dock-app-label {
        color: #fff;
      }

      .dock-app .tooltip {
        position: absolute;
        bottom: 85px;
        background: #000;
        color: #fff;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 0.9rem;
        font-family: var(--font-family);
        white-space: nowrap;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s;
      }
      .dock-app:hover .tooltip {
        opacity: 1;
        visibility: visible;
        transform: translateY(-5px);
      }

      /* --- 2.3 App Windows --- */
      .app-window {
        position: absolute;
        width: 600px;
        height: 400px;
        z-index: 10;
        background: var(--color-bg-glass);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--color-border-glass);
        border-radius: 12px;
        box-shadow: var(--shadow-depth-lg);
        animation: materialize 0.5s ease-out;
        resize: both;
        overflow: hidden;
        min-width: 300px;
        min-height: 200px;
        display: flex;
        flex-direction: column;
        /* Only transition width/height for resize, not position (causes drag lag) */
        transition: width 0.3s ease, height 0.3s ease;
        /* GPU acceleration hints for smooth dragging */
        will-change: transform;
        transform: translateZ(0);
      }
      /* Disable expensive effects during drag for performance */
      .app-window.dragging {
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        transition: none;
        cursor: grabbing;
      }
      @keyframes materialize {
        from {
          opacity: 0;
          transform: scale(0.7) rotateY(45deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotateY(0);
        }
      }
      .window-header {
        width: 100%;
        height: 35px;
        background: rgba(0, 0, 0, 0.3);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 10px;
        cursor: grab;
        flex-shrink: 0;
      }
      .window-header:active {
        cursor: grabbing;
      }
      .window-title {
        font-weight: 700;
        color: var(--color-text);
      }
      .window-controls {
        display: flex;
        gap: 8px;
        flex-grow: 1;
        justify-content: space-between;
      }
      .window-controls-left {
        display: flex;
        gap: 8px;
      }
      .window-controls-right {
        display: flex;
        gap: 8px;
      }
      .window-controls button {
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        line-height: 1;
        font-weight: bold;
        color: #000;
      }
      .win-btn-icon {
        background: none;
        color: var(--color-text-muted);
        width: 20px;
        height: 20px;
        border-radius: 4px;
      }
      .win-btn-icon svg {
        width: 12px;
        height: 12px;
        stroke: var(--color-text-muted);
        stroke-width: 3;
      }
      .win-btn-icon:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .win-btn-icon:hover svg {
        stroke: var(--color-text);
      }
      .btn-close {
        background: var(--color-accent-red);
      }
      .btn-min {
        background: #f0a000;
      }
      .btn-max {
        background: var(--color-accent-green);
      }
      .window-content {
        padding: 20px;
        flex-grow: 1;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: var(--color-border-glass) transparent;
      }
      .window-content::-webkit-scrollbar {
        width: 8px;
      }
      .window-content::-webkit-scrollbar-track {
        background: transparent;
      }
      .window-content::-webkit-scrollbar-thumb {
        background-color: var(--color-border-glass);
        border-radius: 8px;
      }
      .window-content h3 {
        color: var(--color-accent-primary);
        border-bottom: 1px solid var(--color-border-glass);
        padding-bottom: 10px;
        margin-bottom: 15px;
      }
      .window-content p {
        margin-bottom: 10px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 100px 1fr;
        gap: 15px;
        align-items: center;
      }
      .form-grid label {
        font-weight: 700;
        color: var(--color-text-muted);
      }
      .form-grid input,
      .form-grid select,
      .form-grid textarea {
        width: 100%;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--color-text-muted);
        color: var(--color-text);
        padding: 10px;
        font-family: var(--font-family);
        font-size: 1rem;
        border-radius: 5px;
      }
      .form-grid input:focus,
      .form-grid select:focus,
      .form-grid textarea:focus {
        outline: none;
        border-color: var(--color-accent-primary);
      }
      .data-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
      }
      .data-table th,
      .data-table td {
        padding: 10px 12px;
        text-align: right;
        border-bottom: 1px solid var(--color-border-glass);
      }
      .data-table th {
        background: rgba(0, 0, 0, 0.3);
        color: var(--color-accent-primary);
      }
      .data-table tr:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .win-btn {
        background: var(--color-accent-primary);
        border: none;
        color: #fff;
        padding: 10px 15px;
        font-family: var(--font-family);
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s;
        border-radius: 5px;
        margin: 10px 5px 0 0;
      }
      .win-btn:hover {
        background: var(--color-accent-secondary);
        transform: translateY(-2px);
      }
      .win-btn-danger {
        background: var(--color-accent-red);
      }
      .win-btn-danger:hover {
        background: #ff5555;
      }
      .audit-log {
        font-family: var(--font-mono);
        color: var(--color-text);
        background: rgba(0, 0, 0, 0.3);
        padding: 10px;
        border-radius: 5px;
        height: 100%;
        overflow-y: auto;
      }

      /* ================================================================================
         HRM EMPLOYEES CRUD INTERFACE STYLES
         Reference: SYSTEM ARCHITECTURE & TECHNICAL SPE.md - Section 7.2, 7.3
         ================================================================================ */

      /* --- 2.8 Enhanced Data Table with Actions --- */
      .data-table-container {
        width: 100%;
        overflow-x: auto;
      }
      .data-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }
      .data-table th {
        position: sticky;
        top: 0;
        background: rgba(0, 120, 240, 0.2);
        color: var(--color-accent-primary);
        font-weight: 700;
        cursor: pointer;
        user-select: none;
        transition: background 0.2s;
      }
      .data-table th:hover {
        background: rgba(0, 120, 240, 0.4);
      }
      .data-table th.sorted-asc::after {
        content: " ▲";
        font-size: 0.7em;
      }
      .data-table th.sorted-desc::after {
        content: " ▼";
        font-size: 0.7em;
      }

      .data-table td.actions-cell {
        white-space: nowrap;
        text-align: center;
      }
      .row-action-btn {
        background: transparent;
        border: 1px solid var(--color-border-glass);
        color: var(--color-text-muted);
        width: 32px;
        height: 32px;
        border-radius: 6px;
        cursor: pointer;
        margin: 0 3px;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .row-action-btn:hover {
        background: var(--color-accent-primary);
        color: #fff;
        border-color: var(--color-accent-primary);
      }
      .row-action-btn.view-btn:hover {
        background: var(--color-accent-secondary);
        border-color: var(--color-accent-secondary);
      }
      .row-action-btn.edit-btn:hover {
        background: #f0a000;
        border-color: #f0a000;
      }
      .row-action-btn.delete-btn:hover {
        background: var(--color-accent-red);
        border-color: var(--color-accent-red);
      }
      .row-action-btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
      }

      /* --- 2.9 Toolbar (Search, Filter, Pagination) --- */
      .module-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
        margin-bottom: 15px;
        padding: 10px 15px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
      }
      .toolbar-search {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .toolbar-search input {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--color-border-glass);
        color: var(--color-text);
        padding: 10px 15px;
        font-family: var(--font-family);
        font-size: 0.95rem;
        border-radius: 6px;
        width: 250px;
      }
      .toolbar-search input:focus {
        outline: none;
        border-color: var(--color-accent-primary);
        box-shadow: 0 0 8px rgba(0, 120, 240, 0.3);
      }
      .toolbar-actions {
        display: flex;
        gap: 10px;
      }
      .toolbar-btn {
        background: var(--color-accent-primary);
        border: none;
        color: #fff;
        padding: 10px 20px;
        font-family: var(--font-family);
        font-weight: 600;
        font-size: 0.95rem;
        border-radius: 6px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
      }
      .toolbar-btn:hover {
        background: var(--color-accent-secondary);
        transform: translateY(-2px);
        box-shadow: var(--shadow-depth-md);
      }
      .toolbar-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }

      /* --- 2.10 Pagination --- */
      .pagination {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
        padding: 15px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
      }
      .pagination-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid var(--color-border-glass);
        color: var(--color-text);
        padding: 8px 15px;
        font-family: var(--font-family);
        font-size: 0.9rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
      }
      .pagination-btn:hover:not(:disabled) {
        background: var(--color-accent-primary);
        border-color: var(--color-accent-primary);
      }
      .pagination-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .pagination-info {
        color: var(--color-text-muted);
        font-size: 0.9rem;
      }
      .pagination-info strong {
        color: var(--color-text);
      }

      /* --- 2.11 Modal Form System --- */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        z-index: 3000;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      .modal {
        background: var(--color-bg-glass);
        border: 1px solid var(--color-accent-primary);
        border-radius: 12px;
        box-shadow: var(--shadow-depth-lg), 0 0 30px rgba(0, 120, 240, 0.3);
        max-width: 800px;
        width: 90%;
        max-height: 85vh;
        display: flex;
        flex-direction: column;
        animation: slideUp 0.4s ease;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 25px;
        border-bottom: 1px solid var(--color-border-glass);
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px 12px 0 0;
      }
      .modal-title {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--color-accent-primary);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .modal-title svg {
        width: 24px;
        height: 24px;
        stroke: var(--color-accent-primary);
      }
      .modal-close {
        background: transparent;
        border: none;
        color: var(--color-text-muted);
        width: 36px;
        height: 36px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s;
      }
      .modal-close:hover {
        background: var(--color-accent-red);
        color: #fff;
      }
      .modal-close svg {
        width: 20px;
        height: 20px;
        stroke: currentColor;
        stroke-width: 3;
      }

      .modal-body {
        padding: 25px;
        overflow-y: auto;
        flex: 1;
      }

      /* --- 2.12 Tab Navigation in Modal --- */
      .modal-tabs {
        display: flex;
        gap: 5px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--color-border-glass);
        padding-bottom: 10px;
        outline: none;
        direction: rtl;
      }
      .modal-tab {
        background: transparent;
        border: none;
        color: var(--color-text-muted);
        padding: 10px 20px;
        font-family: var(--font-family);
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        border-radius: 6px 6px 0 0;
        transition: all 0.2s;
        position: relative;
      }
      .modal-tab:focus {
        outline: none;
        box-shadow: none;
      }
      .modal-tab:hover {
        color: var(--color-text);
        background: rgba(255, 255, 255, 0.05);
      }
      .modal-tab.active {
        color: var(--color-accent-primary);
        background: rgba(0, 120, 240, 0.1);
      }
      .modal-tab.active::after {
        content: "";
        position: absolute;
        bottom: -11px;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--color-accent-primary);
      }
      .tab-content {
        display: none;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.2s ease, transform 0.2s ease;
        direction: rtl;
      }
      .tab-content.active {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }

      /* --- 2.13 Enhanced Form Grid --- */
      .form-grid-enhanced {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .form-field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .form-field.full-width {
        grid-column: 1 / -1;
      }
      .form-field label {
        font-weight: 600;
        color: var(--color-text-muted);
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .form-field label .required {
        color: var(--color-accent-red);
      }
      .form-field input,
      .form-field select,
      .form-field textarea {
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--color-border-glass);
        color: var(--color-text);
        padding: 12px 15px;
        font-family: var(--font-family);
        font-size: 1rem;
        border-radius: 6px;
        transition: all 0.2s;
      }
      .form-field input:focus,
      .form-field select:focus,
      .form-field textarea:focus {
        outline: none;
        border-color: var(--color-accent-primary);
        box-shadow: 0 0 10px rgba(0, 120, 240, 0.3);
      }
      .form-field input:read-only,
      .form-field select:disabled,
      .form-field textarea:read-only {
        background: rgba(50, 50, 60, 0.5);
        color: var(--color-text-muted);
        cursor: not-allowed;
      }
      .form-field input.error,
      .form-field select.error,
      .form-field textarea.error {
        border-color: var(--color-accent-red);
        box-shadow: 0 0 10px rgba(217, 48, 48, 0.3);
      }
      .form-field .field-error {
        color: var(--color-accent-red);
        font-size: 0.85rem;
        margin-top: 3px;
      }

      /* --- 2.14 Modal Footer --- */
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        padding: 20px 25px;
        border-top: 1px solid var(--color-border-glass);
        background: rgba(0, 0, 0, 0.2);
        border-radius: 0 0 12px 12px;
      }
      .modal-btn {
        padding: 12px 25px;
        font-family: var(--font-family);
        font-weight: 600;
        font-size: 1rem;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
      }
      .modal-btn-primary {
        background: var(--color-accent-primary);
        border: none;
        color: #fff;
      }
      .modal-btn-primary:hover {
        background: var(--color-accent-secondary);
        transform: translateY(-2px);
      }
      .modal-btn-primary:disabled {
        background: var(--color-text-muted);
        cursor: not-allowed;
        transform: none;
      }
      .modal-btn-secondary {
        background: transparent;
        border: 1px solid var(--color-border-glass);
        color: var(--color-text);
      }
      .modal-btn-secondary:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--color-text-muted);
      }
      .modal-btn-danger {
        background: var(--color-accent-red);
        border: none;
        color: #fff;
      }
      .modal-btn-danger:hover {
        background: #ff5555;
      }

      /* --- 2.15 View Record Display --- */
      .record-view {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .record-field {
        padding: 15px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        border-right: 3px solid var(--color-accent-primary);
      }
      .record-field.full-width {
        grid-column: 1 / -1;
      }
      .record-field-label {
        font-size: 0.85rem;
        color: var(--color-text-muted);
        margin-bottom: 5px;
      }
      .record-field-value {
        font-size: 1.05rem;
        color: var(--color-text);
        font-weight: 500;
      }

      /* --- 2.16 Loading & Empty States --- */
      .loading-spinner {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px;
        color: var(--color-text-muted);
      }
      .loading-spinner::before {
        content: "";
        width: 40px;
        height: 40px;
        border: 3px solid var(--color-border-glass);
        border-top-color: var(--color-accent-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 15px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--color-text-muted);
      }
      .empty-state svg {
        width: 80px;
        height: 80px;
        stroke: var(--color-border-glass);
        margin-bottom: 20px;
      }
      .empty-state h4 {
        font-size: 1.2rem;
        color: var(--color-text);
        margin-bottom: 10px;
      }

      /* --- 2.17 Toast Notifications --- */
      .toast-container {
        position: fixed;
        top: 70px;
        left: 20px;
        z-index: 4000;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        background: var(--color-bg-glass);
        border: 1px solid var(--color-border-glass);
        border-radius: 8px;
        padding: 15px 20px;
        min-width: 300px;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: var(--shadow-depth-lg);
        animation: slideInRight 0.3s ease;
      }
      @keyframes slideInRight {
        from {
          transform: translateX(-100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      .toast.success {
        border-right: 4px solid var(--color-accent-green);
      }
      .toast.error {
        border-right: 4px solid var(--color-accent-red);
      }
      .toast.warning {
        border-right: 4px solid #f0a000;
      }
      .toast svg {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }
      .toast.success svg {
        stroke: var(--color-accent-green);
      }
      .toast.error svg {
        stroke: var(--color-accent-red);
      }
      .toast.warning svg {
        stroke: #f0a000;
      }
      .toast-message {
        flex: 1;
      }
      .toast-close {
        background: transparent;
        border: none;
        color: var(--color-text-muted);
        cursor: pointer;
        padding: 5px;
      }

      /* --- 2.18 Confirm Dialog --- */
      .confirm-dialog {
        background: var(--color-bg-glass);
        border: 1px solid var(--color-accent-red);
        border-radius: 12px;
        padding: 30px;
        max-width: 400px;
        text-align: center;
        box-shadow: var(--shadow-depth-lg), 0 0 30px rgba(217, 48, 48, 0.2);
      }
      .confirm-dialog svg {
        width: 60px;
        height: 60px;
        stroke: var(--color-accent-red);
        margin-bottom: 20px;
      }
      .confirm-dialog h4 {
        font-size: 1.3rem;
        margin-bottom: 10px;
      }
      .confirm-dialog p {
        color: var(--color-text-muted);
        margin-bottom: 25px;
      }
      .confirm-dialog .dialog-actions {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      /* --- 2.19 Responsive Design --- */
      @media (max-width: 768px) {
        .form-grid-enhanced {
          grid-template-columns: 1fr;
        }
        .record-view {
          grid-template-columns: 1fr;
        }
        .modal {
          width: 95%;
          max-height: 90vh;
        }
        .module-toolbar {
          flex-direction: column;
          align-items: stretch;
        }
        .toolbar-search input {
          width: 100%;
        }
        #neural-dock {
          flex-wrap: wrap;
          height: auto;
          padding: 15px;
        }
      }

      /* --- 2.4 The "Nexus" (Command Center) --- */
      #nexus {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 600px;
        background: var(--color-bg-glass);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--color-accent-primary);
        border-radius: 12px;
        box-shadow: var(--shadow-depth-lg),
          0 0 15px var(--color-accent-secondary);
        z-index: 2000;
        padding: 20px;
        display: none;
        animation: nexus-pulse 0.7s ease-out;
      }
      @keyframes nexus-pulse {
        from {
          opacity: 0;
          transform: translate(-50%, -50%) scale(0.8);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      #nexus h3 {
        text-align: center;
        color: var(--color-accent-primary);
        margin-bottom: 15px;
      }
      #nexus-input {
        width: 100%;
        padding: 15px;
        font-family: var(--font-family);
        font-size: 1.2rem;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid var(--color-border-glass);
        border-radius: 8px;
        color: var(--color-text);
        text-align: right;
      }
      #nexus-input:focus {
        outline: none;
        border-color: var(--color-accent-primary);
      }
      #nexus-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
        z-index: 1999;
        display: none;
      }

      /* --- 2.5 Floating Action Buttons (FAB) --- */
      #fab-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 900;
        pointer-events: none;
      }

      .module-fab {
        position: absolute;
        width: 60px;
        height: 60px;
        display: none;
        z-index: 901;
        pointer-events: auto;
      }

      .fab-main {
        width: 60px;
        height: 60px;
        background: var(--color-accent-primary);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        box-shadow: var(--shadow-depth-md);
        transition: all 0.3s ease;
      }
      .fab-main:active {
        cursor: grabbing;
      }
      .fab-main svg {
        width: 30px;
        height: 30px;
        stroke: #fff;
        stroke-width: 2;
        pointer-events: none;
      }
      .fab-main:hover {
        transform: scale(1.1);
        background: var(--color-accent-secondary);
      }

      .fab-rays {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform: scale(0);
        opacity: 0;
        transition: all 0.3s ease-out;
        pointer-events: none;
      }
      .module-fab.active .fab-rays {
        transform: scale(1);
        opacity: 1;
        pointer-events: auto;
      }
      .fab-ray {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 100px;
        transform-origin: 0 50%;
        height: 1px;
      }
      .fab-sub-app {
        position: absolute;
        right: -20px;
        top: -20px;
        width: 40px;
        height: 40px;
        background: #fff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        box-shadow: var(--shadow-depth-md);
        transition: all 0.2s ease;
      }
      .fab-sub-app svg {
        width: 20px;
        height: 20px;
        stroke: var(--color-accent-primary);
        stroke-width: 2;
      }
      .fab-sub-app:hover {
        background: var(--color-text-muted);
      }

      .fab-ray:nth-child(1) {
        transform: translate(30px, 30px) rotate(-45deg);
      }
      .fab-ray:nth-child(2) {
        transform: translate(30px, 30px) rotate(0deg);
      }
      .fab-ray:nth-child(3) {
        transform: translate(30px, 30px) rotate(45deg);
      }
      .fab-ray:nth-child(1) .fab-sub-app {
        transition-delay: 0.05s;
      }
      .fab-ray:nth-child(2) .fab-sub-app {
        transition-delay: 0.1s;
      }
      .fab-ray:nth-child(3) .fab-sub-app {
        transition-delay: 0.15s;
      }

      /* --- 2.6 Status Bar --- */
      #status-bar {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 998;
        background: var(--color-bg-glass);
        border: 1px solid var(--color-border-glass);
        border-radius: 8px;
        padding: 10px 15px;
        display: flex;
        gap: 20px;
        font-family: var(--font-mono);
        font-size: 1rem;
        color: var(--color-text-muted);
        box-shadow: var(--shadow-depth-md);
      }
      #user-info {
        color: var(--color-text);
        font-weight: 700;
      }
      #date-time {
        direction: ltr;
        text-align: left;
        color: var(--color-accent-green);
        min-width: 200px;
      }

      /* --- 2.7 Task Switcher --- */
      #task-switcher {
        position: fixed;
        top: -55px;
        left: 50%;
        transform: translateX(-50%);
        height: 60px;
        z-index: 998;
        background: var(--color-bg-glass);
        border: 1px solid var(--color-border-glass);
        border-radius: 0 0 12px 12px;
        box-shadow: var(--shadow-depth-md);
        padding: 5px 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: top 0.3s ease;
      }

      #task-switcher:hover {
        top: 0;
      }

      .task-thumb {
        width: 100px;
        height: 50px;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--color-border-glass);
        border-radius: 5px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        overflow: hidden;
        transition: all 0.2s ease;
      }
      .task-thumb:hover {
        transform: scale(1.1);
        border-color: var(--color-accent-primary);
      }
      .task-thumb.minimized {
        opacity: 0.6;
        background: rgba(0, 0, 0, 0.6);
      }
      .task-thumb-icon {
        width: 20px;
        height: 20px;
      }
      .task-thumb-icon svg {
        width: 100%;
        height: 100%;
        stroke: var(--color-text-muted);
      }
      .task-thumb-title {
        font-family: var(--font-family);
        font-size: 0.7rem;
        color: var(--color-text-muted);
        white-space: nowrap;
      }
    </style>

    <script>
      /* ================================================================================
         III. JAVASCRIPT "OS KERNEL" - Enhanced with HRM_Employees CRUD
         Reference: SYSTEM ARCHITECTURE & TECHNICAL SPE.md

      document.addEventListener("DOMContentLoaded", () => {
        document.documentElement.setAttribute("spellcheck", "false");
        try {
          document
            .querySelectorAll('input, textarea, [contenteditable="true"]')
            .forEach((el) => el.setAttribute("spellcheck", "false"));
        } catch (e) {}

        // ================================================================================
        // 1. ELEMENT SELECTORS & STATE MANAGEMENT
        // ================================================================================

        const bootScreen = document.getElementById("boot-screen");
        const bootLog = document.getElementById("boot-log");
        const loginBox = document.getElementById("login-box");
        const loginButton = document.getElementById("login-button");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const nijjaraOS = document.getElementById("nijjara-os");
        const windowTemplate = document.getElementById("window-template");
        const fabContainer = document.getElementById("fab-container");
        const fabTemplate = document.getElementById("fab-template");
        const fabRayTemplate = document.getElementById("fab-ray-template");
        const taskSwitcher = document.getElementById("task-switcher");
        const taskThumbTemplate = document.getElementById(
          "task-thumb-template"
        );
        const nexus = document.getElementById("nexus");
        const nexusOverlay = document.getElementById("nexus-overlay");
        const toastContainer = document.getElementById("toast-container");

        // Module State Management
        const moduleState = {
          currentModule: null,
          currentWindow: null,
          pagination: { page: 1, pageSize: 15, totalPages: 0, totalRecords: 0 },
          sortColumn: null,
          sortDirection: "asc",
          searchTerm: "",
          sourceSheet: null,
          viewId: null,
        };

        // --- 2. Boot Sequence & Login ---
        const bootMessages = [
          "BOOTING NIJJARA-OS v1.0...",
          "Loading kernel modules... OK",
          "Initializing 3D glass display... DONE",
          "Connecting to neural-link... SECURE",
          "Loading user authentication service...",
          "Awaiting system key...",
        ];

        let i = 0;
        function runBootLog() {
          if (i < bootMessages.length) {
            const p = document.createElement("p");
            p.textContent = `> ${bootMessages[i]}`;
            bootLog.appendChild(p);
            bootLog.scrollTop = bootLog.scrollHeight;
            i++;
            setTimeout(runBootLog, Math.random() * 300 + 100);
          } else {
            loginBox.style.display = "flex";
          }
        }

        loginButton.addEventListener("click", handleLogin);
        passwordInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") {
            const u = usernameInput.value.trim();
            const p = passwordInput.value.trim();
            if (u && p) handleLogin();
          }
        });

        // --- REAL BACKEND LOGIN (The Update) ---
        function handleLogin() {
          const user = usernameInput.value.trim();
          const pass = passwordInput.value.trim();
          const btn = loginButton;
          const feedback = document.getElementById("login-feedback");

          if (!user || !pass) {
            console.log("[Guard] Empty credentials, skipping login.");
            return;
          }

          btn.disabled = true;
          btn.textContent = "جاري التحقق...";
          feedback.textContent = "";

          try {
            google.script.run
              .withSuccessHandler((res) => {
                if (res && res.success) {
                  logToConsole("Login successful.", "CLIENT-SUCCESS");

                  nijjaraOS.style.display = "block";
                  bootScreen.style.opacity = "0";
                  bootScreen.style.visibility = "hidden";
                  setTimeout(() => {
                    bootScreen.style.display = "none";
                  }, 1000);

                  const uName =
                    res.user && res.user.USR_Name ? res.user.USR_Name : user;
                  document.getElementById(
                    "user-info"
                  ).textContent = `USER: ${uName}`;
                  startClock();
                  if (res.token) sessionStorage.setItem("erp_token", res.token);

                  try {
                    document.dispatchEvent(
                      new CustomEvent("erp_login_success")
                    );
                  } catch (e) {}
                } else {
                  logToConsole(
                    "Login failed: INVALID_CREDENTIALS",
                    "CLIENT-ERROR"
                  );
                  feedback.textContent = "بيانات الاعتماد غير صحيحة";
                  btn.disabled = false;
                  btn.textContent = "تسجيل دخول";
                }
              })
              .withFailureHandler((e) => {
                feedback.textContent = "خطأ في الاتصال بالخادم";
                btn.disabled = false;
                btn.textContent = "تسجيل دخول";
              })
              .login(user, pass);
          } catch (e) {
            console.log("Not in GAS environment.");
          }
        }

        runBootLog();

        function autoBootstrapFromQuery() {}

        var __rec_queue = [];
        var __rec_flush_timer = null;
        function pushClientEvent(evt) {
          try {
            evt = evt || {};
            evt.ts = Date.now();
            __rec_queue.push(evt);
            if (!__rec_flush_timer) {
              __rec_flush_timer = setTimeout(flushClientEvents, 1000);
            }
          } catch (e) {}
        }
        function flushClientEvents() {
          try {
            __rec_flush_timer = null;
            if (!__rec_queue.length) return;
            var batch = __rec_queue.splice(0, __rec_queue.length);
            var token = sessionStorage.getItem("erp_token") || "";
            google.script.run
              .withSuccessHandler(function () {})
              .withFailureHandler(function () {})
              .recordClientEvents(token, batch);
          } catch (e) {}
        }
        try {
          var rec = new URLSearchParams(location.search).get("record");
          if (rec && rec !== "0") {
            document.addEventListener(
              "click",
              function (e) {
                try {
                  var t = e.target;
                  var id = t && t.id ? t.id : "";
                  var tag = t && t.tagName ? t.tagName : "";
                  var txt =
                    t && t.textContent
                      ? String(t.textContent).trim().slice(0, 120)
                      : "";
                  pushClientEvent({
                    type: "click",
                    id: id,
                    tag: tag,
                    text: txt,
                  });
                } catch (err) {}
              },
              true
            );
            document.addEventListener(
              "input",
              function (e) {
                try {
                  var t = e.target;
                  var id = t && t.id ? t.id : "";
                  var tag = t && t.tagName ? t.tagName : "";
                  var val =
                    t && t.type === "password"
                      ? "***"
                      : t && t.value
                      ? String(t.value).slice(0, 120)
                      : "";
                  pushClientEvent({
                    type: "input",
                    id: id,
                    tag: tag,
                    value: val,
                  });
                } catch (err) {}
              },
              true
            );
            var c = window.console || {};
            var origLog = c.log ? c.log.bind(c) : function () {};
            var origWarn = c.warn ? c.warn.bind(c) : function () {};
            var origErr = c.error ? c.error.bind(c) : function () {};
            console.log = function () {
              try {
                pushClientEvent({
                  type: "console_log",
                  args: Array.prototype.slice.call(arguments),
                });
              } catch (e) {}
              origLog.apply(c, arguments);
            };
            console.warn = function () {
              try {
                pushClientEvent({
                  type: "console_warn",
                  args: Array.prototype.slice.call(arguments),
                });
              } catch (e) {}
              origWarn.apply(c, arguments);
            };
            console.error = function () {
              try {
                pushClientEvent({
                  type: "console_error",
                  args: Array.prototype.slice.call(arguments),
                });
              } catch (e) {}
              origErr.apply(c, arguments);
            };
          }
        } catch (e) {}

        function openLiveMonitor() {
          try {
            closeModal();
            var overlay = document.createElement("div");
            overlay.className = "modal-overlay";
            overlay.innerHTML = `
              <div class="modal" style="max-width:900px;">
                <div class="modal-header"><h3>Live Monitor</h3></div>
                <div class="modal-body" id="live-monitor" style="direction:ltr; text-align:left; font-family:monospace; white-space:pre; max-height:420px; overflow:auto;"></div>
                <div class="modal-footer">
                  <button class="modal-btn" onclick="exportSessionHistory()">Export Session</button>
                  <button class="modal-btn modal-btn-secondary" onclick="closeModal()">إغلاق</button>
                </div>
              </div>`;
            document.body.appendChild(overlay);
            var token = sessionStorage.getItem("erp_token") || "";
            var tick = function () {
              try {
                google.script.run
                  .withSuccessHandler(function (res) {
                    try {
                      var box = document.getElementById("live-monitor");
                      if (!box) return;
                      var list = Array.isArray(res && res.events)
                        ? res.events
                        : [];
                      box.textContent = JSON.stringify(list, null, 2);
                    } catch (e) {}
                  })
                  .withFailureHandler(function () {})
                  .getRecentClientEvents(token, 50);
              } catch (e) {}
            };
            tick();
            var iv = setInterval(tick, 2000);
            overlay.addEventListener("click", function (e) {
              if (e.target === overlay) {
                clearInterval(iv);
              }
            });
          } catch (e) {}
        }

        function exportSessionHistory() {
          try {
            var token = sessionStorage.getItem("erp_token") || "";
            google.script.run
              .withSuccessHandler(function (res) {
                try {
                  var list = Array.isArray(res && res.events) ? res.events : [];
                  var now = new Date();
                  var y = now.getFullYear();
                  var m = String(now.getMonth() + 1).padStart(2, "0");
                  var d = String(now.getDate()).padStart(2, "0");
                  var name = `session-history-${y}-${m}-${d}.json`;
                  var blob = new Blob([JSON.stringify(list, null, 2)], {
                    type: "application/json",
                  });
                  var a = document.createElement("a");
                  a.href = URL.createObjectURL(blob);
                  a.download = name;
                  a.click();
                  URL.revokeObjectURL(a.href);
                } catch (e) {}
              })
              .withFailureHandler(function () {})
              .getRecentClientEvents(token, 500);
          } catch (e) {}
        }

        try {
          window.openLiveMonitor = openLiveMonitor;
          window.exportSessionHistory = exportSessionHistory;
        } catch (e) {}

        function startClock() {
          const dateTimeEl = document.getElementById("date-time");
          if (!dateTimeEl) return;

          function updateTime() {
            const now = new Date();
            const date = now.toLocaleDateString("ar-EG-u-nu-latn", {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
            });
            const time = now.toLocaleTimeString("en-US", {
              hour12: true,
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit",
            });
            dateTimeEl.textContent = `${date} | ${time}`;
          }
          updateTime();
          setInterval(updateTime, 1000);
        }

        // --- 3. Window Manager ---
        let windowCount = 0;
        let highestZ = 10;
        let currentEngineWindow = null;
        const moduleIcons = {
          hrm: "#icon-hrm",
          prj: "#icon-prj",
          fin: "#icon-fin",
          sys: "#icon-sys",
        };

        function createWindow(title, content, moduleId) {
          windowCount++;
          highestZ++;

          const template = windowTemplate.content.cloneNode(true);
          const newWindow = template.querySelector(".app-window");

          const windowId = `window-${moduleId}-${Date.now()}`;
          newWindow.id = windowId;

          newWindow.style.top = `${50 + windowCount * 20}px`;
          newWindow.style.left = `${100 + windowCount * 20}px`;
          newWindow.style.zIndex = highestZ;
          newWindow.dataset.moduleId = moduleId;

          newWindow.querySelector(".window-title").textContent = title;
          newWindow.querySelector(".window-content").innerHTML = content;

          addTaskThumb(windowId, moduleId, title);

          // Close
          newWindow
            .querySelector(".btn-close")
            .addEventListener("click", () => {
              removeTaskThumb(windowId);
              newWindow.remove();
            });

          // Minimize
          newWindow.querySelector(".btn-min").addEventListener("click", () => {
            newWindow.style.display = "none";
            document
              .querySelector(`.task-thumb[data-window-id="${windowId}"]`)
              ?.classList.add("minimized");
          });

          // Maximize
          newWindow.querySelector(".btn-max").addEventListener("click", (e) => {
            maximizeWindow(newWindow, e.currentTarget);
          });

          // Toggle FAB
          newWindow
            .querySelector(".btn-toggle-fab")
            .addEventListener("click", () => {
              toggleFabForModule(moduleId);
            });

          // Bring to front
          newWindow.addEventListener("mousedown", () => {
            bringWindowToFront(newWindow);
          });

          makeDraggable(
            newWindow.querySelector(".window-header"),
            newWindow,
            false
          );
          nijjaraOS.appendChild(newWindow);
          return newWindow;
        }

        function bringWindowToFront(windowEl) {
          highestZ++;
          windowEl.style.zIndex = highestZ;
          windowEl.style.display = "block";
          document
            .querySelector(`.task-thumb[data-window-id="${windowEl.id}"]`)
            ?.classList.remove("minimized");
        }

        function maximizeWindow(windowEl, btn) {
          const icon = btn.querySelector("svg use");
          if (windowEl.dataset.isMaximized === "true") {
            // Restore
            windowEl.style.top = windowEl.dataset.oldTop;
            windowEl.style.left = windowEl.dataset.oldLeft;
            windowEl.style.width = windowEl.dataset.oldWidth;
            windowEl.style.height = windowEl.dataset.oldHeight;
            windowEl.dataset.isMaximized = "false";
            icon.setAttribute("href", "#icon-maximize");
          } else {
            // Maximize
            windowEl.dataset.oldTop = windowEl.style.top;
            windowEl.dataset.oldLeft = windowEl.style.left;
            windowEl.dataset.oldWidth = windowEl.style.width;
            windowEl.dataset.oldHeight = windowEl.style.height;
            windowEl.style.top = "0";
            windowEl.style.left = "0";
            windowEl.style.width = "100vw";
            windowEl.style.height = "100vh";
            windowEl.dataset.isMaximized = "true";
            icon.setAttribute("href", "#icon-restore");
          }
        }

        function makeDraggable(header, windowEl, isFab = false) {
          let isDragging = false;
          let startX, startY;
          let initialTop, initialLeft;
          let dragFrame = null;

          header.onmousedown = (e) => {
            if (e.target.closest("button") && !isFab) return;
            e.preventDefault();

            startX = e.clientX;
            startY = e.clientY;

            // Store initial position
            initialTop = windowEl.offsetTop;
            initialLeft = windowEl.offsetLeft;

            // Add dragging class for performance optimization
            if (!isFab) {
              windowEl.classList.add("dragging");
            }

            document.onmouseup = closeDrag;
            document.onmousemove = startDrag;
          };

          function startDrag(e) {
            e.preventDefault();
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            // Only start dragging after threshold (prevents accidental drags)
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
              isDragging = true;

              if (dragFrame) cancelAnimationFrame(dragFrame);
              dragFrame = requestAnimationFrame(() => {
                // Calculate new position directly from initial + delta
                const newTop = initialTop + dy;
                const newLeft = initialLeft + dx;

                // Apply position (more reliable than movementX/Y)
                windowEl.style.top = newTop + "px";
                windowEl.style.left = newLeft + "px";
              });
            }
          }

          function closeDrag() {
            document.onmouseup = null;
            document.onmousemove = null;

            if (dragFrame) cancelAnimationFrame(dragFrame);

            // Remove dragging class
            if (!isFab) {
              windowEl.classList.remove("dragging");
            }

            // FAB click handling - toggle active state (show/hide rays)
            if (!isDragging && isFab) {
              // Toggle the active class to show/hide rays instead of visibility
              windowEl.classList.toggle("active");
              logToConsole(
                `FAB rays toggled: ${
                  windowEl.classList.contains("active") ? "OPEN" : "CLOSED"
                }`,
                "CLIENT-EVENT"
              );
            }

            isDragging = false;
          }
        }

        // --- Window Arrangement Functions ---
        function arrangeWindowsInGrid() {
          logToConsole("Arranging windows in grid...", "CLIENT-EVENT");
          const windows = document.querySelectorAll(
            '.app-window:not([style*="display: none"])'
          );
          const numWindows = windows.length;
          if (numWindows === 0) return;
          const cols = Math.ceil(Math.sqrt(numWindows));
          const rows = Math.ceil(numWindows / cols);
          const winWidth = window.innerWidth / cols;
          const winHeight = window.innerHeight / rows;

          windows.forEach((win, index) => {
            const row = Math.floor(index / cols);
            const col = index % cols;
            win.style.top = `${row * winHeight}px`;
            win.style.left = `${col * winWidth}px`;
            win.style.width = `${winWidth}px`;
            win.style.height = `${winHeight}px`;
          });
        }

        function arrangeWindowsCascade() {
          logToConsole("Arranging windows in cascade...", "CLIENT-EVENT");
          const windows = document.querySelectorAll(
            '.app-window:not([style*="display: none"])'
          );
          windows.forEach((win, index) => {
            win.style.top = `${50 + index * 40}px`;
            win.style.left = `${100 + index * 40}px`;
            win.style.width = "600px";
            win.style.height = "400px";
            win.style.zIndex = 10 + index;
          });
        }

        function minimizeAllWindows() {
          logToConsole("Minimizing all windows", "CLIENT-EVENT");
          document.querySelectorAll(".app-window").forEach((win) => {
            win.style.display = "none";
            document
              .querySelector(`.task-thumb[data-window-id="${win.id}"]`)
              ?.classList.add("minimized");
          });
        }

        function expandAllWindows() {
          logToConsole("Expanding all windows", "CLIENT-EVENT");
          document
            .querySelectorAll('.app-window[style*="display: none"]')
            .forEach((win) => {
              win.style.display = "block";
              document
                .querySelector(`.task-thumb[data-window-id="${win.id}"]`)
                ?.classList.remove("minimized");
            });
        }

        // --- 4. Dock App Listeners ---

        function openOrFocusWindow(moduleId, title, content, fabConfig) {
